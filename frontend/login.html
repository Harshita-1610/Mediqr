<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MediQR Login</title>

    <link rel="stylesheet"
          href="../assets/css/login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>

<div class="login-container">


    <!-- ================= LEFT ================= -->

    <div class="login-left">

        <div class="brand">

            <i class="fa-solid fa-heart-pulse"></i>

            <span>MediQR</span>

        </div>


        <div class="welcome">

           <h1>Welcome Back!</h1>

    <p>
        Securely access your healthcare information
        with MediQR.
    </p>

    <img
        src="../assets/images/login.png"
        alt="MediQR Healthcare"
        class="login-image">

        </div>


        <div class="features">

            <div>
                <i class="fa-solid fa-shield-halved"></i>
                Secure Medical Records
            </div>

            <div>
                <i class="fa-solid fa-qrcode"></i>
                Quick QR Access
            </div>

            <div>
                <i class="fa-solid fa-user-doctor"></i>
                Easy Doctor Access
            </div>

        </div>

    </div>



    <!-- ================= RIGHT ================= -->

    <div class="login-right">

        <div class="login-card">

            <h2>Login</h2>

            <p class="subtitle">
                Select your account type to continue
            </p>


            <!-- ================= ROLE ================= -->

            <label>
                Login as
            </label>

            <div class="role-selection">


                <!-- PATIENT -->

                <button
                    type="button"
                    class="role-btn active"
                    id="patientRole"
                    onclick="selectRole('patient')">

                    <i class="fa-solid fa-user"></i>

                    <span>
                        <strong>Patient</strong>
                        <small>Access my health records</small>
                    </span>

                </button>


                <!-- HOSPITAL -->

                <button
    type="button"
    class="role-btn"
    id="doctorRole"
    onclick="selectRole('doctor')">

    <i class="fa-solid fa-user-doctor"></i>

    <span>
        <strong>Doctor</strong>
        <small>Manage patient records</small>
    </span>

</button>

            </div>


            <!-- ================= FORM ================= -->

            <form id="loginForm">

                <label for="email">
                    Email Address
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                    <i
                        class="fa-solid fa-eye password-eye"
                        onclick="togglePassword()">
                    </i>

                </div>


                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember">

                        Remember me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>

            </form>


            <p class="register-text">

                Don't have an account?

                <a href="register.html" id="registerLink">
                   Register
              </a>

            </p>

        </div>

    </div>

</div>


<script src="../assets/js/login.js"></script>

</body>

</html>
