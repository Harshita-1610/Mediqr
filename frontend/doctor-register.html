<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Registration | MediQR</title>

    <link rel="stylesheet" href="../assets/css/doctor-register.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<div class="register-page">


    <!-- ================= LEFT PANEL ================= -->

    <div class="left-panel">

        <div class="left-content">

            <div class="brand">

                <i class="fa-solid fa-heart-pulse"></i>

                <h1>MediQR</h1>

            </div>


            <h2>
                Empowering Doctors<br>
                with Digital Healthcare
            </h2>


            <p>
                Manage your patients, prescriptions and medical
                information securely with MediQR.
            </p>


            <div class="doctor-icon">

                <i class="fa-solid fa-user-doctor"></i>

            </div>

        </div>

    </div>



    <!-- ================= RIGHT PANEL ================= -->

    <div class="right-panel">


        <div class="register-card">


            <div class="card-logo">

                <i class="fa-solid fa-user-doctor"></i>

            </div>


            <h2>Doctor Registration</h2>

            <p class="subtitle">
                Create your doctor account
            </p>



            <!-- ================= FORM ================= -->

            <form id="doctorRegisterForm">


                <!-- Doctor Name -->

                <div class="input-group">

                    <label for="doctorName">
                        Doctor Name
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-user-doctor"></i>

                        <input
                            type="text"
                            id="doctorName"
                            placeholder="Enter doctor name"
                            required>

                    </div>

                </div>



                <!-- Medical Licence Number -->

                <div class="input-group">

                    <label for="licenseNumber">
                        Medical Licence Number
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-id-card"></i>

                        <input
                            type="text"
                            id="licenseNumber"
                            placeholder="Enter medical licence number"
                            required>

                    </div>

                </div>



                <!-- Specialization -->

                <div class="input-group">

                    <label for="specialization">
                        Specialization
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-stethoscope"></i>

                        <select
                            id="specialization"
                            required>

                            <option value="">
                                Select specialization
                            </option>

                            <option value="General Physician">
                                General Physician
                            </option>

                            <option value="Cardiologist">
                                Cardiologist
                            </option>

                            <option value="Dermatologist">
                                Dermatologist
                            </option>

                            <option value="Neurologist">
                                Neurologist
                            </option>

                            <option value="Pediatrician">
                                Pediatrician
                            </option>

                            <option value="Orthopedic">
                                Orthopedic
                            </option>

                            <option value="Gynecologist">
                                Gynecologist
                            </option>

                            <option value="Dentist">
                                Dentist
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>

                </div>



                <!-- Qualification -->

                <div class="input-group">

                    <label for="qualification">
                        Qualification
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-graduation-cap"></i>

                        <input
                            type="text"
                            id="qualification"
                            placeholder="Example: MBBS, MD"
                            required>

                    </div>

                </div>



                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email address"
                            required>

                    </div>

                </div>



                <!-- Mobile -->

                <div class="input-group">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-phone"></i>

                        <input
                            type="tel"
                            id="mobile"
                            placeholder="Enter mobile number"
                            maxlength="10"
                            required>

                    </div>

                </div>



                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create password"
                            required>

                        <i
                            class="fa-solid fa-eye password-eye"
                            id="togglePassword">
                        </i>

                    </div>

                </div>



                <!-- Submit -->

                <button
                    type="submit"
                    class="register-btn">

                    <i class="fa-solid fa-user-plus"></i>

                    Create Doctor Account

                </button>


            </form>



            <!-- Login -->

            <div class="login-text">

                Already have a doctor account?

                <a href="login.html">
                    Login
                </a>

            </div>


        </div>

    </div>

</div>

<div class="login-text">

    Already have a doctor account?

    <a href="login.html">
        Login
    </a>

</div>

<script src="../assets/js/doctor-register.js"></script>

</body>

</html>
